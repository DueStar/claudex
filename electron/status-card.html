<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Claudex</title>
<style>
  /* Just the words, on a see-through window; a soft shadow keeps them readable on any background */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Pretendard Variable', 'Malgun Gothic', system-ui, sans-serif;
    font-size: 14px; font-weight: 600; color: #f1f2f5;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.6);
    -webkit-user-select: none; user-select: none; cursor: default;
  }
</style>
</head>
<body>
  <span role="status" aria-live="polite" id="msg"></span>
<script>
  // The words for each step in Korean, English and Japanese
  const WORDS = {
    updating: { ko: 'Claudex 업데이트하는 중이에요…', en: 'Updating Claudex…', ja: 'Claudex をアップデート中です…' },
    starting: { ko: 'Claudex 준비하고 있어요…', en: 'Starting Claudex…', ja: 'Claudex を準備しています…' },
  }
  const q = new URLSearchParams(location.search)
  const step = WORDS[q.get('step')] ? q.get('step') : 'updating'
  const lang = ['ko', 'en', 'ja'].includes(q.get('lang')) ? q.get('lang') : 'ko'
  document.documentElement.lang = lang
  document.getElementById('msg').textContent = WORDS[step][lang]
</script>
</body>
</html>
