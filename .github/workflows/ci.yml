name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS are the app's platforms; Linux keeps the Unix-only
        # checks (file modes, symlinks) running, which skip on Windows. The Mac
        # app itself is built and launched by mac.yml
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the job never pushes: no token left behind in .git/config
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # The Electron binary is not needed for type-checking or tests
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Type-check
        run: npx tsc --noEmit -p .

      # Before the tests: tests/dist-check.test.ts checks the built page in dist/
      - name: Build
        run: npx vite build

      - name: Test
        run: npm test
