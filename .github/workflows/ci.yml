name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Claudex is a Windows app; Linux keeps the Unix-only checks (file
        # modes, symlinks) running, which skip on Windows
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # The Electron binary is not needed for type-checking or tests
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
